name: marcelo.txt
tagline: Posts sobre software, sistemas e arquitetura.
url: https://marcelo-maga.github.io
footer: ""
language: pt-BR
pagination: 6
toc: true
json_feed: true
enable_search: true
search_title: Buscar
search_show_matches: true
search_match_count: 3
media_path: vault/midia
default_date_format: "%d/%m/%Y"

menu:
    - ["Início", "index.html"]
    - ["Posts", "archive.html"]
    - ["Grafo", "grafo.html"]
    - ["Sobre", "about.html"]

default_author: editorial
authors:
    editorial:
        name: Marcelo Magalhães
        avatar: https://github.com/Marcelo-maga.png
        bio: just a dev
        links:
            - ["GitHub", "https://github.com/Marcelo-maga"]
            - ["LinkedIn", "https://www.linkedin.com/in/marcelo-maga/"]
            - ["Sobre", "about.html"]

publish_md: true
publish_urls_json: true

markdown_parser:
    extension:
        wikilinks_title_before_pipe: false
        wikilinks_title_after_pipe: true

extra:
    colorscheme_toggle: false
    colormode: dark
    colormodetoggle: false
